<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lịch Phụng Vụ Công Giáo</title>
  <meta name="description" content="Lịch Phụng Vụ Công Giáo Việt Nam: lễ ngày, bài đọc, âm lịch, Tết, ăn chay kiêng thịt.">
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Áp dụng giao diện sáng/tối ngay từ đầu để tránh nháy màn hình
    try { var t = localStorage.getItem('kcal.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#calendar">Bỏ qua tới lịch</a>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M16 6v20M9 13h14" stroke="var(--bg)" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="brand-text"><h1>Lịch Phụng Vụ</h1><span>Công Giáo Việt Nam</span></div>
    </div>

    <div class="seg" role="tablist" aria-label="Chế độ xem" id="viewSwitch">
      <button role="tab" data-view="month" aria-selected="true">Tháng</button>
      <button role="tab" data-view="year" aria-selected="false">Năm</button>
      <button role="tab" data-view="list" aria-selected="false">Danh sách</button>
    </div>

    <div class="tools">
      <button class="btn" id="btnToday" title="Về hôm nay (phím T)">Hôm nay</button>
      <label class="datejump" title="Đi tới ngày">
        <span class="sr">Đi tới ngày</span>
        <input type="date" id="jumpDate" aria-label="Đi tới ngày" min="1583-01-01" max="9000-12-31">
      </label>
      <div class="seg seg-small" role="group" aria-label="Cỡ chữ">
        <button id="fontDec" aria-label="Giảm cỡ chữ">A−</button>
        <button id="fontInc" aria-label="Tăng cỡ chữ">A+</button>
      </div>
      <button class="icon-btn" id="btnSearch" aria-label="Tìm lễ" title="Tìm lễ (phím /)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="btn" id="btnExport" title="Xuất lịch">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>
        <span class="hide-sm">Xuất lịch</span>
      </button>
      <button class="icon-btn" id="btnTheme" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="shell" id="main">
    <section class="stage" aria-label="Lịch">
      <section class="peek" id="peek" aria-label="Ngày đang chọn" aria-live="polite"></section>
      <div class="stage-head">
        <div class="nav">
          <button class="icon-btn" id="prevPeriod" aria-label="Kỳ trước"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
          <h2 id="periodTitle" aria-live="polite"></h2>
          <button class="icon-btn" id="nextPeriod" aria-label="Kỳ sau"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <div class="legend" aria-label="Chú giải màu phụng vụ">
          <span><i class="dot c-green"></i>Thường niên</span>
          <span><i class="dot c-purple"></i>Vọng · Chay</span>
          <span><i class="dot c-white"></i>Trắng</span>
          <span><i class="dot c-red"></i>Đỏ</span>
        </div>
      </div>
      <div id="calendar" class="calendar" tabindex="-1"></div>

    </section>

  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Chi tiết ngày" hidden></aside>

  <dialog id="exportDlg" class="dlg">
    <form method="dialog" id="exportForm">
      <header><h3>Xuất lịch</h3><button class="icon-btn" value="cancel" aria-label="Đóng">✕</button></header>
      <fieldset>
        <legend>Phạm vi</legend>
        <label class="radio"><input type="radio" name="range" value="month" checked> Tháng đang xem</label>
        <label class="radio"><input type="radio" name="range" value="year"> Cả năm đang xem</label>
        <label class="radio"><input type="radio" name="range" value="custom"> Tuỳ chọn:
          <span class="inline">từ <input type="month" id="exFrom" min="1583-01" max="9000-12" aria-label="Từ tháng"> đến <input type="month" id="exTo" min="1583-01" max="9000-12" aria-label="Đến tháng"></span></label>
      </fieldset>
      <fieldset>
        <legend>Nội dung</legend>
        <label class="check"><input type="checkbox" id="exLunar" checked> Âm lịch</label>
        <label class="check"><input type="checkbox" id="exSaints" checked> Các lễ nhớ, lễ thánh khác trong ngày</label>
        <label class="check"><input type="checkbox" id="exRefs" checked> Tham chiếu bài đọc</label>
        <label class="check"><input type="checkbox" id="exText"> Toàn văn bài đọc (file lớn, chỉ JSON)</label>
      </fieldset>
      <footer>
        <button class="btn" value="json" id="exJson">Tải JSON</button>
        <button class="btn btn-primary" value="pdf" id="exPdf">In / Lưu PDF</button>
      </footer>
    </form>
  </dialog>

  <dialog id="searchDlg" class="dlg dlg-search" aria-labelledby="searchTitle">
    <header><h3 id="searchTitle">Tìm lễ</h3><button type="button" class="icon-btn" id="searchClose" aria-label="Đóng">✕</button></header>
    <div class="srch-bar">
      <input type="search" id="searchQ" placeholder="Ví dụ: Phêrô, Tết, Lễ Tro…" autocomplete="off" aria-label="Tên lễ cần tìm">
      <div class="srch-year"><button type="button" class="icon-btn" data-sy="-1" aria-label="Năm trước">‹</button><span id="searchYear"></span><button type="button" class="icon-btn" data-sy="1" aria-label="Năm sau">›</button></div>
    </div>
    <ul id="searchRes" class="srch-res" aria-live="polite"></ul>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="Reading/Saints.js"></script>
  <script src="js/lunar.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/readings.js"></script>
  <script src="js/bible.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
